buildscript {
    repositories { mavenCentral() }
    dependencies {
        // Flyway's Oracle support and JDBC driver live on the plugin's own classpath,
        // separate from the application dependencies below.
        classpath 'org.flywaydb:flyway-database-oracle:13.4.0'
        classpath 'com.oracle.database.jdbc:ojdbc11:23.26.3.0.0'
    }
}
plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.flywaydb.flyway' version '13.4.0'
    id 'org.owasp.dependencycheck' version '13.0.0'
}

group = 'com.tradefinance'
version = '1.0.0'
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories { mavenCentral() }

def loadEnvFile() {
    def props = new Properties()
    def envFile = file('../.env')
    if (envFile.exists()) { envFile.withInputStream { props.load(it) } }
    return props
}

def envProps = loadEnvFile()
flyway {
    url = System.getenv('DB_URL') ?: envProps.getProperty('DB_URL')
    user = System.getenv('DB_USER') ?: envProps.getProperty('DB_USER')
    password = System.getenv('DB_PASSWORD') ?: envProps.getProperty('DB_PASSWORD')
    locations = ['filesystem:database/migrations']
    // Lets flywayMigrate adopt a schema that install.sql already bootstrapped via sqlplus
    // (e.g. the compose.dev.yml container): schema objects exist but flyway_schema_history
    // does not yet, so the first run records V1 as a baseline instead of failing.
    baselineOnMigrate = true
    baselineVersion = '1'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.5'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'
    runtimeOnly 'com.oracle.database.jdbc:ojdbc11'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test') {
    useJUnitPlatform { excludeTags 'oracle' }
    testLogging { events 'failed'; exceptionFormat 'full' }
}
dependencyCheck {
    // NVD rate-limits unauthenticated lookups hard; get a free key at https://nvd.nist.gov/developers/request-an-api-key
    nvd { apiKey = System.getenv('NVD_API_KEY') }
    formats = ['HTML', 'JSON']
    failBuildOnCVSS = 7
    suppressionFile = 'dependency-check-suppressions.xml'
}
tasks.named('processResources') {
    from('../frontend/dist') { into 'static' }
}
tasks.named('bootRun') {
    envProps.each { key, value -> environment(key, value) }
}
tasks.named('bootJar') {
    doFirst {
        if (!file('../frontend/dist/index.html').exists() && !file('src/main/resources/static/index.html').exists()) {
            throw new GradleException('Build the Vue UI first: cd frontend && npm ci && npm run build')
        }
    }
}
tasks.register('oracleTest', Test) {
    description = 'Runs integration tests against a disposable installed Oracle schema.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'oracle' }
    doFirst {
        if (!System.getenv('ORACLE_TEST_URL')) throw new GradleException('ORACLE_TEST_URL is required')
    }
}
